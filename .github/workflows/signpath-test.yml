name: SignPath test signing

on:
  push:
    branches:
      - chore/signpath-test-20260811
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sign-windows-installer:
    name: SignPath test (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            target: x86_64-pc-windows-msvc
            arch: x64
          - label: windows-aarch64
            target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      ANGLE_ELECTRON_VERSION: v33.0.0
      SIGNPATH_ORGANIZATION_ID: b94b9113-1b2a-4677-8449-093531a5e6e9
      SIGNPATH_PROJECT_SLUG: openpencil
      SIGNPATH_SIGNING_POLICY_SLUG: test-signing
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: windows-installer-zip
      HAS_SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: signpath-test-${{ matrix.target }}
      - name: Resolve workspace version
        shell: bash
        run: |
          set -euo pipefail
          echo "OP_VERSION=$(scripts/workspace-version.sh)" >> "$GITHUB_ENV"
      - name: Validate SignPath test-signing credentials
        shell: pwsh
        run: |
          if ($env:HAS_SIGNPATH_API_TOKEN -ne 'true') {
            throw 'SIGNPATH_API_TOKEN must be configured before running SignPath test signing.'
          }
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $nsisRoots = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          $makensis = $null
          foreach ($root in $nsisRoots) {
            $candidate = Join-Path $root 'makensis.exe'
            if (Test-Path $candidate) {
              $makensis = $candidate
              break
            }
          }
          if (-not $makensis) {
            throw 'makensis.exe not found after NSIS install'
          }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Append
          & $makensis /VERSION
      - name: Build Windows installer payload
        shell: pwsh
        run: cargo build -p op-host-desktop -p op-cli --target ${{ matrix.target }} --release
      - name: Stage ANGLE DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $ver = "$env:ANGLE_ELECTRON_VERSION"
          $url = "https://github.com/electron/electron/releases/download/$ver/electron-$ver-win32-$arch.zip"
          $zip = Join-Path $env:RUNNER_TEMP "electron-$arch.zip"
          $extract = Join-Path $env:RUNNER_TEMP "electron-$arch"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $destination = "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release"
          foreach ($dll in @('libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll')) {
            $source = Join-Path $extract $dll
            if (-not (Test-Path $source)) {
              throw "ANGLE DLL '$dll' not found in $url"
            }
            Copy-Item -Path $source -Destination $destination -Force
          }
      - name: Package NSIS installer
        shell: pwsh
        run: |
          makensis `
            "/DVERSION=$env:OP_VERSION" `
            "/DARCH=${{ matrix.arch }}" `
            "/DBIN_DIR=$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release" `
            "/DICON_FILE=$env:GITHUB_WORKSPACE\crates\op-host-desktop\assets\icon.ico" `
            "/DOUT_FILE=$env:GITHUB_WORKSPACE\OpenPencil-$env:OP_VERSION-${{ matrix.arch }}-win-setup.exe" `
            scripts\package-windows.nsi
      - name: Upload unsigned installer to SignPath
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-installer-${{ matrix.arch }}
          path: OpenPencil-${{ env.OP_VERSION }}-${{ matrix.arch }}-win-setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Submit SignPath test signing request
        id: signpath_test_signing
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed
      - name: Verify signed installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "OpenPencil-$env:OP_VERSION-${{ matrix.arch }}-win-setup.exe"
          $signedInstallers = @(
            Get-ChildItem -Path signpath-signed -Recurse -File |
              Where-Object { $_.Name -eq $installer }
          )
          if ($signedInstallers.Count -ne 1) {
            throw "Expected exactly one signed installer named $installer, found $($signedInstallers.Count)."
          }
          Copy-Item -LiteralPath $signedInstallers[0].FullName -Destination $installer -Force
          $signature = Get-AuthenticodeSignature -FilePath $installer
          $allowedStatuses = @('Valid', 'NotTrusted')
          if ($null -eq $signature.SignerCertificate -or $signature.Status.ToString() -notin $allowedStatuses) {
            throw "SignPath returned an invalid Authenticode signature: $($signature.Status)."
          }
          Write-Host "SignPath test signature found: $($signature.SignerCertificate.Subject)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SignPath request: ${{ steps.signpath_test_signing.outputs.signing-request-web-url }}"
      - name: Upload SignPath test-signed installer
        uses: actions/upload-artifact@v4
        with:
          name: openpencil-signpath-test-${{ matrix.arch }}
          path: OpenPencil-${{ env.OP_VERSION }}-${{ matrix.arch }}-win-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
